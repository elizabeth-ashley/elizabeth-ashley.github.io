# Build settings
markdown: kramdown

exclude:
  - 'Gemfile'
  - 'Gemfile.lock'
  - '*.gemspec'
  - 'README.md'
  - 'node_modules'
  - 'build'
  - 'gulpfile.js'
  - 'package.json'
  - 'package-lock.json'
  # Local bundler install path. Without this Jekyll walks into the gems and
  # tries to render Jekyll's own site_template posts, which fails the build.
  - 'vendor'
  - '.bundle'
  - '_scripts'

keep_files:
  - 'CNAME'
  - '.git'
  - '.gitignore'

# `plugins_dir` points at a directory of local plugin source; listing gem names
# under it silently loaded nothing, so neither of these was ever active. The key
# for gem plugins is `plugins`.
#
# jekyll-minifier is deliberately not listed: it is not on the GitHub Pages
# plugin whitelist, so naming it here would fail the build. HTML compression is
# already handled by the `compress` layout in _layouts/compress.html.
plugins:
  - jekyll-sitemap
